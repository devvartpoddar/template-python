[project]
name = "app"
version = "0.1.0"
description = "Project scaffold — rename src/app to your project's package name."
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
data = [
    "polars",
    "httpx",
    "pydantic",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
